apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "orders-api"
        # One file, two sources: the endpoint from KV, a short-lived MySQL user from the database engine.
        # The agent renews the lease, and fetches a new user when it can no longer renew.
        vault.hashicorp.com/agent-inject-secret-db.env: "database/creds/orders-api"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "secret/data/orders-api/prod/database" }}
          export DB_HOST="{{ .Data.data.host }}"
          export DB_NAME="{{ .Data.data.name }}"
          {{- end }}
          {{- with secret "database/creds/orders-api" }}
          export DB_USER="{{ .Data.username }}"
          export DB_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-requests-cpu: "25m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
    spec:
      serviceAccountName: orders-api
      # The shell loop ignores SIGTERM; don't make the audience wait 30s for a restart.
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: mysql:8.0   # only for the mysql client
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                . /vault/secrets/db.env
                MYSQL_PWD="$DB_PASSWORD" mysql -h "$DB_HOST" -u "$DB_USER" -N -B "$DB_NAME" \
                  -e "SELECT CONCAT(TIME(NOW()), '  connected as ', CURRENT_USER(), '  orders=', COUNT(*)) FROM orders" \
                  || echo "$(date +%T)  DB access FAILED"
                sleep 10
              done
          resources:
            requests: { cpu: 10m, memory: 64Mi }
