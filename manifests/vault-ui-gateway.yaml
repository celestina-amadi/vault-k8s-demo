# Browser -> GCP load balancer -> Envoy (in GKE) -> Vault VM (private IP, no public address).
# Placeholders are filled in by setup/05-envoy-gateway.sh.

# Envoy settings: the load balancer only accepts the allowed source ranges.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: vault-ui-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerSourceRanges: [__ALLOWED_CIDRS__]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: vault-ui-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vault-ui
  namespace: vault
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vault-ui-tls
---
# A Service with no selector, pointing at the VM: lets Envoy treat external Vault like any backend.
apiVersion: v1
kind: Service
metadata:
  name: vault-external
  namespace: vault
spec:
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-external-vm
  namespace: vault
  labels:
    kubernetes.io/service-name: vault-external
addressType: IPv4
ports:
  - name: http
    port: 8200
    protocol: TCP
endpoints:
  - addresses: ["__VAULT_IP__"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  parentRefs:
    - name: vault-ui
  rules:
    - backendRefs:
        - name: vault-external
          port: 8200
